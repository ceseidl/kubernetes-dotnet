# Opcional: exige um Ingress Controller no cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos
spec:
  ingressClassName: nginx
  rules:
    - host: pedidos.exemplo.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pedidos
                port:
                  name: http
